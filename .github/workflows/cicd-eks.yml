name: CI/CD EKS Deploy

on:
  push:
    branches:
      - main

jobs:
  build-vote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push vote
        uses: docker/build-push-action@v6
        with:
          context: ./VoteApp/vote
          file: ./VoteApp/vote/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/voting-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/voting-app:multiarch

  build-result:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push result
        uses: docker/build-push-action@v6
        with:
          context: ./VoteApp/result
          file: ./VoteApp/result/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/result-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/result-app:multiarch

  build-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: ./VoteApp/worker
          file: ./VoteApp/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/worker-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/worker-app:multiarch

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-vote, build-result, build-worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name hagen-eks-lab2v1 \
            --region us-east-2

      - name: Deploy to EKS
        run: |
          kubectl apply -n 3tier-hagen \
            -f eks-cluster-pvc/k8s/postgres-deployment.yml \
            -f eks-cluster-pvc/k8s/postgres-service.yml \
            -f eks-cluster-pvc/k8s/redis-deployment.yml \
            -f eks-cluster-pvc/k8s/redis-service.yml \
            -f eks-cluster-pvc/k8s/worker-deployment.yml \
            -f eks-cluster-pvc/k8s/vote-deployment.yml \
            -f eks-cluster-pvc/k8s/vote-service.yml \
            -f eks-cluster-pvc/k8s/result-deployment.yml \
            -f eks-cluster-pvc/k8s/result-service.yml \
            -f eks-cluster-pvc/k8s/ingress.yml

      - name: Restart deployments
        run: |
          echo "🔄 Restarting deployments to pull new images..."
          kubectl rollout restart deployment vote result worker -n 3tier-hagen

          echo "⏳ Waiting for vote deployment..."
          kubectl rollout status deployment vote -n 3tier-hagen --timeout=120s || {
            echo "❌ Rollout failed for vote!"
            kubectl describe deployment vote -n 3tier-hagen
            exit 1
          }

          echo "⏳ Waiting for result deployment..."
          kubectl rollout status deployment result -n 3tier-hagen --timeout=120s || {
            echo "❌ Rollout failed for result!"
            kubectl describe deployment result -n 3tier-hagen
            exit 1
          }

          echo "⏳ Waiting for worker deployment..."
          kubectl rollout status deployment worker -n 3tier-hagen --timeout=120s || {
            echo "❌ Rollout failed for worker!"
            kubectl describe deployment worker -n 3tier-hagen
            exit 1
          }

          echo "✅ All deployments successfully rolled out!"

      - name: Verify pods and services
        run: |
          echo "🚀 Pods status:"
          kubectl get pods -n 3tier-hagen
          echo "📋 Services:"
          kubectl get services -n 3tier-hagen
          echo "🌐 Ingress:"
          kubectl get ingress -n 3tier-hagen
