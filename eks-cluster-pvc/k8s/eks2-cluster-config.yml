apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: hagen-eks-lab2v1
  region: us-east-2
  version: "1.30"

nodeGroups:
  - name: ng-lab
    instanceType: t3.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    privateNetworking: true
    volumeSize: 30
    volumeType: gp3
    labels:
      role: worker
    tags:
      nodegroup: lab
    iam:
      withAddonPolicies:
        ebs: true
